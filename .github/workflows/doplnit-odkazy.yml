# Doplnění odkazů u nabídek uložených dřív, než se adresa detailu ukládala
# ve funkčním tvaru.
#
# Jednorázová oprava dat — spouští se ručně. Běží v Actions, protože Sreality
# odmítají požadavky z datových center. Nejdřív záloha, ať je kam couvnout.

name: Doplnit odkazy na inzeráty

on:
  workflow_dispatch:

jobs:
  doplnit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Kontrola připojovacích řetězců
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/kontrola-pripojeni.ts

      - name: Záloha před zásahem
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run backup

      - name: Ulož zálohu jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: zaloha-pred-odkazy-${{ github.run_number }}
          path: zalohy/*.json
          retention-days: 90

      - name: Doplnit odkazy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run odkazy:doplnit
