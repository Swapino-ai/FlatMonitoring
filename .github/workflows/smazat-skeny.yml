# Jednorázové smazání všech dosavadních dat skenu trhu (nabídky, inzeráty,
# zařazení, snímky, ocenění a odhady nájmu ze skenu). Ruční ocenění zůstávají.
# Před smazáním se uloží záloha jako artefakt.

name: Smazat data skenů trhu

on:
  workflow_dispatch:
    inputs:
      potvrzeni:
        description: "Pro potvrzení napiš SMAZAT"
        required: true
      akce:
        description: "vse = smazat všechna data skenů; den = jen sloučit historii ocenění po dnech; fotky = smazat stažené fotky inzerátů (stáhnou se znovu)"
        required: false
        default: "vse"

jobs:
  smazat:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.potvrzeni == 'SMAZAT' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Záloha před smazáním
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run backup
      - name: Ulož zálohu jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: zaloha-pred-smazanim-skenu-${{ github.run_number }}
          path: zalohy/*.json
          retention-days: 90
      - name: Smazat data skenů
        if: ${{ github.event.inputs.akce == 'vse' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/smazat-skeny.ts
      - name: Sloučit historii ocenění po dnech
        if: ${{ github.event.inputs.akce == 'den' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/uklid-oceneni.ts
      - name: Smazat stažené fotky inzerátů
        if: ${{ github.event.inputs.akce == 'fotky' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npx tsx scripts/uklid-fotek.ts
