# Diagnostika inzertnich portalu. Spousti se jen rucne.
# Nemeni zadna data — pouze vypise, co ktera adresa vraci.

name: Sonda portálů

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Ověření odkazů na detail inzerátu
        run: npx tsx scripts/probe-odkazy.ts

      - name: Sken v malé obci
        run: npx tsx scripts/probe-male-mesto.ts

      - name: Test scraperů proti živým portálům
        id: test
        run: npx tsx scripts/test-scrapers.ts

      - name: Sonda polí a filtrů (jen při selhání testu)
        if: failure() && steps.test.conclusion == 'failure'
        run: npx tsx scripts/probe-fields.ts
