# Sonda: jak na Sreality hledat v malé obci a zda jde detail vložit do iframe. Jen čte, nic nemění.
name: Sonda oblasti
on:
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hlavičky detailu (iframe)
        run: curl -sI -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0 Safari/537.36" "https://www.sreality.cz/detail/prodej/byt/3+kk/velemin-oparno-/2993688652" | grep -iE "^(HTTP|x-frame|content-security)" || true
