# Měsíční sken trhu.
#
# Neběží na Vercelu záměrně: sken mezi dotazy záměrně čeká, aby portály
# nezatěžoval, a do časového limitu serverless funkce by se nevešel.
# GitHub Actions žádný takový limit nemá.
#
# Nastavení: Settings → Secrets and variables → Actions → New repository secret
#   DATABASE_URL  — pooled řetězec z Neonu
#   DIRECT_URL    — direct řetězec z Neonu
#   MAPY_API_KEY  — klíč z developer.mapy.cz; bez něj se u obcí bez vlastního
#                   výpisu na Sreality nedohledá kraj a sken pro ně skončí bez dat

name: Měsíční sken trhu

on:
  schedule:
    - cron: "0 4 1 * *" # 1. den v měsíci, 4:00 UTC
  workflow_dispatch: # ruční spuštění tlačítkem v záložce Actions

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Kontrola připojovacích řetězců
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/kontrola-pripojeni.ts

      - name: Sken trhu a přecenění
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: npm run market:scan

      - name: Záloha dat
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run backup

      - name: Ulož zálohu jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zaloha-${{ github.run_number }}
          path: zalohy/*.json
          retention-days: 90
