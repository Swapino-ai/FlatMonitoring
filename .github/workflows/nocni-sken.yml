# Noční sken trhu — jediný plánovaný běh aplikace.
#
# Projde jen nemovitosti se zapnutým „Sledovat trh“, uloží nabídky do databáze
# trhu, navrhne nové k zařazení a přepočítá odhad jen ze zařazených nabídek.
# U zařazených pořídí screenshot stránky a ověří, že inzerát ještě existuje.
#
# Neběží na Vercelu záměrně: Sreality odmítají dotazy z datových center
# a sken mezi dotazy čeká, aby portál nezatěžoval — do limitu serverless
# funkce by se nevešel.
#
# Nastavení: Settings → Secrets and variables → Actions → New repository secret
#   DATABASE_URL  — pooled řetězec z Neonu
#   DIRECT_URL    — direct řetězec z Neonu
#   MAPY_API_KEY  — klíč z developer.mapy.cz; bez něj se u obcí bez vlastního
#                   výpisu na Sreality nedohledá kraj a sken pro ně skončí bez dat

name: Noční sken trhu

on:
  schedule:
    - cron: "40 1 * * *" # každý den v 1:40 UTC (3:40 SELČ)
  workflow_dispatch: # ruční spuštění tlačítkem v záložce Actions

jobs:
  sken:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Kontrola připojovacích řetězců
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx tsx scripts/kontrola-pripojeni.ts

      - name: Prohlížeč pro screenshoty zařazených inzerátů
        run: npx playwright install --with-deps chromium

      - name: Sken trhu (jen sledované nemovitosti), návrhy a odhad ze zařazených
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
          # Volitelne: se stejnymi klici jako ve Vercelu se snimky nahraji rovnou na Google Disk
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: npm run sken

      - name: Záloha dat
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run backup

      - name: Ulož zálohu jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zaloha-${{ github.run_number }}
          path: zalohy/*.json
          retention-days: 90
