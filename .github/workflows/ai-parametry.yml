# AI parametry inzerátů — ruční spuštění mimo noční sken.
#
# Načte stránky navržených a zařazených inzerátů, které ještě nemají parametry,
# a nechá AI vytáhnout typ domu, stav bytu, podlaží atd. Na konci porovná
# výsledek s tím, co jsi u zařazených nastavil ručně, a vypíše cenu běhu.
#
# Secret: ANTHROPIC_API_KEY (console.anthropic.com → API Keys)

name: AI parametry inzerátů

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Kolik inzerátů nejvýš zpracovat"
        default: "40"

jobs:
  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: AI parametry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/ai-parametry.ts ${{ inputs.limit }}
