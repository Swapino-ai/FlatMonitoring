# Presun databaze Neon do jineho regionu (napr. z USA do Frankfurtu).
#
# Neon region existujiciho projektu zmenit neumi, proto se zalozi novy projekt v EU
# a tenhle workflow do nej prekopiruje VSE: schema, data, sekvence (cisla najemniku),
# propojeni s Google Diskem i pamet slozek.
#
# Stara databaze se jen CTE — nic se v ni nemeni ani nemaze, takze kdykoli lze vratit
# puvodni adresy. Do nove se nic neprepise: kdyz v ni neco je, workflow se zastavi.
#
# Priprava: docs/migrace-neon-eu.md. Secrets:
#   DIRECT_URL        stavajici (USA) — staci jakakoli adresa (pooled i direct), workflow si priame spojeni odvodi
#   NOVA_DIRECT_URL   nova (EU)       — totez

name: Migrace databáze do nového regionu

on:
  workflow_dispatch:
    inputs:
      potvrzeni:
        description: 'Pro potvrzení napiš slovo MIGROVAT'
        required: true

jobs:
  migrace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ inputs.potvrzeni == 'MIGROVAT' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Příprava adres (adresy se nevypisují)
        env:
          STARA_SECRET: ${{ secrets.DIRECT_URL }}
          NOVA_SECRET: ${{ secrets.NOVA_DIRECT_URL }}
        run: |
          [ -n "$STARA_SECRET" ] || { echo "::error::Chybí secret DIRECT_URL (stará databáze)."; exit 1; }
          [ -n "$NOVA_SECRET" ]  || { echo "::error::Chybí secret NOVA_DIRECT_URL (nová databáze)."; exit 1; }

          # pg_dump a psql potřebují přímé spojení: z "pooled" adresy se odstraní "-pooler" v hostiteli
          # a parametr pgbouncer (ten zná jen Prisma, libpq ho odmítne). Zbytek zůstává.
          normalizuj() {
            local u="${1//-pooler/}"
            u="$(echo "$u" | sed -E 's/([?&])pgbouncer=[a-z]+&?/\1/; s/[?&]$//')"
            echo "$u"
          }
          STARA_D="$(normalizuj "$STARA_SECRET")"
          NOVA_D="$(normalizuj "$NOVA_SECRET")"

          [ "$STARA_D" != "$NOVA_D" ] || { echo "::error::Stará a nová adresa jsou stejné."; exit 1; }

          # Odvozené adresy se jinak nemaskují, proto je maskuji sám
          echo "::add-mask::$STARA_D"
          echo "::add-mask::$NOVA_D"
          { echo "STARA_D=$STARA_D"; echo "NOVA_D=$NOVA_D"; } >> "$GITHUB_ENV"

          # Z adresy vypíšu jen region, ať je vidět, odkud kam se jde
          reg() { echo "$1" | grep -oE '(us|eu|ap|sa|ca|me|af)-[a-z]+-[0-9]+' | head -1; }
          echo "Stará databáze: $(reg "$STARA_D")"
          echo "Nová databáze:  $(reg "$NOVA_D")"

      - name: Verze serverů (klient musí být stejně nový jako nejnovější z nich)
        run: |
          # Verzi zjistí jednoduchý dotaz; jakýkoli novější psql ho zvládne
          verze() { docker run --rm postgres:17 psql "$1" -tA -c "show server_version_num" | tr -d '[:space:]'; }
          VS=$(verze "$STARA_D"); VN=$(verze "$NOVA_D")
          [ -n "$VS" ] && [ -n "$VN" ] || { echo "::error::Nepodařilo se zjistit verzi Postgresu (špatná adresa nebo heslo?)."; exit 1; }
          MS=$((VS / 10000)); MN=$((VN / 10000))
          echo "Postgres: stará databáze $MS, nová $MN"
          [ "$MN" -ge "$MS" ] || { echo "::error::Nová databáze ($MN) má starší Postgres než stará ($MS). Založ nový projekt ve verzi $MS nebo novější."; exit 1; }
          # pg_dump musí mít verzi aspoň jako server, ze kterého čte
          echo "PGIMG=postgres:$MN" >> "$GITHUB_ENV"

      - name: Záloha staré databáze (pro jistotu)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run backup

      - name: Ulož zálohu jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: zaloha-pred-migraci-${{ github.run_number }}
          path: zalohy/*.json
          retention-days: 90

      - name: Nová databáze musí být prázdná
        run: |
          pocet=$(docker run --rm "$PGIMG" psql "$NOVA_D" -tA -c "select count(*) from information_schema.tables where table_schema='public'")
          echo "Tabulek v nové databázi: $pocet"
          [ "$pocet" = "0" ] || { echo "::error::Nová databáze není prázdná. Založ nový prázdný projekt, nebo ji vyčisti."; exit 1; }

      - name: Přenos (schéma, data, sekvence)
        run: |
          set -o pipefail
          # pg_dump jen čte; psql běží v jedné transakci, takže při chybě nová databáze zůstane prázdná
          docker run --rm "$PGIMG" pg_dump "$STARA_D" --no-owner --no-privileges --no-comments --format=plain \
            | docker run --rm -i "$PGIMG" psql "$NOVA_D" -v ON_ERROR_STOP=1 --single-transaction -q -o /dev/null

      - name: Porovnání počtu řádků ve všech tabulkách
        env:
          STARA_URL: ${{ env.STARA_D }}
          NOVA_URL: ${{ env.NOVA_D }}
        run: npx tsx scripts/porovnej-databaze.ts

      - name: Schéma v nové databázi je v souladu s aplikací
        env:
          DATABASE_URL: ${{ env.NOVA_D }}
          DIRECT_URL: ${{ env.NOVA_D }}
        run: npx prisma db push --skip-generate

      - name: Co dál
        run: |
          echo "Migrace proběhla a počty řádků sedí."
          echo "Teď přepni aplikaci na novou databázi (Vercel + GitHub secrets) — postup v docs/migrace-neon-eu.md."
